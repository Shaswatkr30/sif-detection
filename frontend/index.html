<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIF Safety Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #172033;
        }

        header {
            background: #172554;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 6px;
            color: #cbd5e1;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        .card h3 {
            color: #64748b;
            font-size: 15px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .red {
            color: #dc2626;
        }

        .orange {
            color: #d97706;
        }

        .green {
            color: #16a34a;
        }

        .box {
            background: white;
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        textarea {
            width: 100%;
            height: 140px;
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            display: none;
            margin-top: 20px;
        }

        .result-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #2563eb;
        }

        .result-card p {
            margin: 12px 0;
        }

        .recommendation {
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-high {
            background: #fee2e2;
            color: #b91c1c;
        }

        .badge-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-low {
            background: #dcfce7;
            color: #166534;
        }

        @media(max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🛡️ SIF Precursor Detection</h1>
    <p>AI-Based Safety Report Analysis System</p>
</header>

<div class="container">

    <!-- DASHBOARD CARDS -->

    <div class="cards">

        <div class="card">
            <h3>Total Reports</h3>
            <div class="number" id="total">0</div>
        </div>

        <div class="card">
            <h3>High Risk</h3>
            <div class="number red" id="high">0</div>
        </div>

        <div class="card">
            <h3>Medium Risk</h3>
            <div class="number orange" id="medium">0</div>
        </div>

        <div class="card">
            <h3>Low Risk</h3>
            <div class="number green" id="low">0</div>
        </div>

    </div>


    <!-- ANALYZER -->

    <div class="box">

        <h2>Analyze Safety Report</h2>

        <textarea
            id="report"
            placeholder="Enter safety incident report here..."
        ></textarea>

        <button onclick="analyze()">
            🤖 Analyze Report
        </button>

        <div id="result">

            <div class="result-card">

                <h2>Analysis Result</h2>

                <p>
                    <b>Risk Level:</b>
                    <span id="risk"></span>
                </p>

                <p>
                    <b>Primary Precursor:</b>
                    <span id="precursor"></span>
                </p>

                <p>
                    <b>Detected Precursors:</b>
                </p>

                <div id="detected"></div>

                <div class="recommendation">

                    <b>💡 Safety Recommendation</b>

                    <p id="recommendation"></p>

                </div>

            </div>

        </div>

    </div>


    <!-- REPORT TABLE -->

    <div class="box">

        <h2>Recent Safety Reports</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Report</th>
                    <th>Risk</th>
                    <th>Precursor</th>
                </tr>

            </thead>

            <tbody id="reports">
            </tbody>

        </table>

    </div>

</div>


<script>

async function loadStats() {

    try {

        const response =
            await fetch("/dashboard/stats");

        const data =
            await response.json();

        document.getElementById("total").innerText =
            data.total_reports;

        document.getElementById("high").innerText =
            data.high_risk;

        document.getElementById("medium").innerText =
            data.medium_risk;

        document.getElementById("low").innerText =
            data.low_risk;

    } catch(error) {

        console.log(error);

    }

}


async function analyze() {

    const text =
        document.getElementById("report").value.trim();

    if (!text) {

        alert("Please enter a safety report.");

        return;

    }


    try {

        const response =
            await fetch("/analyze", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    report_text: text
                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            alert(data.detail || "Analysis failed");

            return;

        }


        document.getElementById("result").style.display =
            "block";


        document.getElementById("risk").innerText =
            data.risk_level;


        document.getElementById("precursor").innerText =
            data.primary_precursor;


        document.getElementById("recommendation").innerText =
            data.recommendation;


        const detected =
            document.getElementById("detected");

        detected.innerHTML = "";


        if (data.detected_precursors.length === 0) {

            detected.innerHTML =
                "<p>No significant precursor detected.</p>";

        } else {

            data.detected_precursors.forEach(item => {

                const p =
                    document.createElement("p");

                p.innerHTML =
                    `<b>${item.precursor}</b>
                     — ${item.keywords.join(", ")}`;

                detected.appendChild(p);

            });

        }


        document.getElementById("report").value = "";

        loadStats();
        loadReports();

    } catch(error) {

        alert("Server error: " + error);

    }

}


async function loadReports() {

    try {

        const response =
            await fetch("/dashboard/recent-reports");

        const data =
            await response.json();


        const table =
            document.getElementById("reports");

        table.innerHTML = "";


        data.forEach(report => {

            let badge = "badge-low";

            if (report.risk_level === "HIGH") {
                badge = "badge-high";
            }

            if (report.risk_level === "MEDIUM") {
                badge = "badge-medium";
            }


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>${report.id}</td>

                <td>${report.report_text}</td>

                <td>
                    <span class="badge ${badge}">
                        ${report.risk_level}
                    </span>
                </td>

                <td>${report.primary_precursor}</td>

            `;


            table.appendChild(row);

        });

    } catch(error) {

        console.log(error);

    }

}


loadStats();
loadReports();

</script>

</body>
</html>
